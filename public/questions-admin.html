<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BCC 3.0 Question Moderation</title>
<link rel="icon" href="bcc-logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFCD03;--k:#000;--w:#fff;--r:#E4002B;--disp:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;--body:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);color:var(--k);background:var(--w);line-height:1.5}
:focus-visible{outline:4px solid var(--r);outline-offset:3px}
.wrap{width:min(1240px,100% - 2rem);margin-inline:auto}
.bar{background:var(--k);color:var(--y);padding:.5rem 0;border-bottom:5px solid var(--r)}
.bar .wrap{display:flex;align-items:center;gap:1rem}.bar img{width:64px;height:64px}
.bar b{font-family:var(--disp);font-weight:800;font-stretch:75%;font-size:1.8rem;flex:1}
.btn{display:inline-block;text-decoration:none;font:800 1rem var(--body);background:var(--k);color:var(--y);border:3px solid var(--k);padding:.6rem 1.1rem;cursor:pointer}
.btn:hover{background:var(--r);border-color:var(--r);color:var(--w)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.sm{padding:.3rem .7rem;font-size:.9rem}
.bar .btn{background:var(--y);color:var(--k);border-color:var(--y)}
main{padding:2rem 0 4rem}
h2{font-family:var(--disp);font-weight:800;font-stretch:75%;font-size:3rem;line-height:1;margin-bottom:1rem}
input,select{font:inherit;border:3px solid var(--k);padding:.65rem .8rem;border-radius:0;background:var(--w)}
input:focus,select:focus{outline:4px solid var(--y);border-color:var(--r)}
#login{max-width:420px;padding-top:2rem}#login .row{display:flex;gap:.6rem;margin-top:.4rem}#login input{width:100%}
.err{color:var(--r);font-weight:800;min-height:1.4em;margin-top:.5rem}
#app{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:.8rem;margin:1rem 0 1.2rem}
.tab{border:4px solid var(--k);padding:.6rem 1rem;background:var(--w);font:inherit;font-weight:800;cursor:pointer;text-align:left}
.tab b{font-family:var(--disp);font-size:1.8rem;font-stretch:75%;margin-right:.4rem}.tab.on{background:var(--y);box-shadow:5px 5px 0 var(--k)}.tab.review b{color:var(--r)}
.tools{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1rem}.tools input{min-width:260px}.tools small{margin-left:auto;font-weight:700}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:.65rem .8rem;border-bottom:2px solid var(--k);vertical-align:top}
th{background:var(--k);color:var(--y)}td.q{font-weight:700;max-width:420px}
td small{display:block;opacity:.7;font-weight:400}
.chip{font-weight:800;padding:.1rem .6rem;background:var(--y);white-space:nowrap}.chip.bad{background:var(--r);color:var(--w)}.chip.mute{background:#ddd}
.acts{display:flex;flex-wrap:wrap;gap:.4rem}
</style>
</head>
<body>
<div class="bar"><div class="wrap"><img src="bcc-logo.webp" alt=""><b>Question moderation</b><a class="btn" href="live.html" target="_blank" rel="noopener">Live screen</a><a class="btn" href="admin.html">Check-ins</a><button class="btn" id="out" style="display:none">Sign out</button></div></div>
<main class="wrap">
  <div id="login"><h2>Sign in</h2>
    <label for="pin"><b>Admin passcode</b></label>
    <div class="row"><input id="pin" type="password" autocomplete="current-password"><button class="btn" id="go">Open</button></div>
    <div class="err" id="lerr" role="alert"></div></div>
  <div id="app">
    <h2>Questions</h2>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search question or name" aria-label="Search">
      <select id="for" aria-label="Filter by who it is for"><option value="">All speakers</option></select>
      <button class="btn ghost" id="refresh">Refresh</button><small id="status"></small>
    </div>
    <div class="err" id="err"></div>
    <div class="tw"><table><thead><tr><th>Question</th><th>For</th><th>Asked by</th><th>Time</th><th>Status</th><th>Answered</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let pin=sessionStorage.getItem("bcc_admin")||"",tab="review",Q=[],timer;
const hdr=()=>({Authorization:"Bearer "+pin,"Content-Type":"application/json"});
const fmt=iso=>new Date(iso).toLocaleString("en-NG",{timeZone:"Africa/Lagos",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const TABS=[["review","Needs review",q=>["pending","held","rejected"].includes(q.status)],["published","Live",q=>q.status==="published"],["answered","Answered",q=>q.status==="answered"],["hidden","Hidden",q=>q.status==="hidden"],["all","All",()=>true]];
const label={pending:"Awaiting approval",published:"Live",held:"Held for review",rejected:"Blocked by filter",hidden:"Hidden",answered:"Answered"};

async function sync(){
  const r=await fetch("/api/qadmin",{headers:hdr(),cache:"no-store"});
  if(r.status===401)throw new Error("auth");if(!r.ok)throw new Error("net");
  Q=(await r.json()).questions;
  const sel=$("for"),cur=sel.value,names=[...new Set(Q.map(q=>q.to))].sort();
  sel.replaceChildren(new Option("All speakers",""),...names.map(n=>new Option(n,n)));sel.value=names.includes(cur)?cur:"";
  draw();$("status").textContent="Updated "+new Date().toLocaleTimeString("en-NG",{timeZone:"Africa/Lagos",hour:"numeric",minute:"2-digit",second:"2-digit"});
}
async function setStatus(key,status){
  $("err").textContent="";
  const r=await fetch("/api/qadmin",{method:"POST",headers:hdr(),body:JSON.stringify({key,status})});
  if(!r.ok){$("err").textContent="Couldn’t update that question.";return}
  const q=Q.find(x=>x.key===key);if(q)q.status=status;draw();
  if(status==="published"||status==="answered"){try{const v=await(await fetch("/api/questions?fresh=1&t="+Date.now(),{cache:"no-store"})).json();
    $("status").textContent=v.questions.some(x=>x.id===key)?"✓ On the live screen now":"Saved, but the live screen hasn’t updated yet. Press Refresh in a few seconds."}catch(e){}}
}
function draw(){
  const np=Q.filter(q=>q.status==="pending"||q.status==="held").length;document.title=(np?"("+np+") ":"")+"BCC 3.0 Question Moderation";
  $("tabs").replaceChildren(...TABS.map(([k,l,fn])=>{const b=document.createElement("button");b.className="tab"+(k==="review"?" review":"")+(tab===k?" on":"");
    const n=document.createElement("b");n.textContent=Q.filter(fn).length;b.append(n,l);b.onclick=()=>{tab=k;draw()};return b}));
  const fn=TABS.find(t=>t[0]===tab)[2],s=$("q").value.toLowerCase().trim(),f=$("for").value;
  $("rows").replaceChildren(...Q.filter(q=>fn(q)&&(!f||q.to===f)&&(!s||(q.text+q.name).toLowerCase().includes(s))).map(q=>{
    const tr=document.createElement("tr"),add=(...p)=>{const td=document.createElement("td");td.append(...p);tr.append(td);return td};
    const small=t=>Object.assign(document.createElement("small"),{textContent:t});
    add(q.text).className="q";
    add(q.to);add(q.name,small(q.email));add(fmt(q.at));
    const c=document.createElement("span");c.className="chip"+(["rejected","held","pending"].includes(q.status)?" bad":q.status==="hidden"?" mute":"");c.textContent=label[q.status]||q.status;
    add(c,...(q.reason?[small(q.reason)]:[]));
    if(q.status==='published'||q.status==='answered'){const k=document.createElement('input');k.type='checkbox';k.checked=q.status==='answered';k.setAttribute('aria-label','Answered');k.style.cssText='width:1.7rem;height:1.7rem;accent-color:#E4002B;cursor:pointer';k.onchange=()=>setStatus(q.key,k.checked?'answered':'published');add(k)}else add('–');
    const a=document.createElement("div");a.className="acts";
    const btn=(t,st,ghost)=>{const b=document.createElement("button");b.className="btn sm"+(ghost?" ghost":"");b.textContent=t;b.onclick=()=>setStatus(q.key,st);a.append(b)};
    if(["pending","held","rejected","hidden"].includes(q.status))btn("Approve and show","published");
    if(q.status!=="hidden")btn("Hide","hidden",1);
    add(a);return tr}));
}
async function start(){
  $("lerr").textContent="";
  try{await sync();$("login").style.display="none";$("app").style.display="block";$("out").style.display="";sessionStorage.setItem("bcc_admin",pin);
    clearInterval(timer);timer=setInterval(()=>sync().catch(()=>{}),8000)}
  catch(e){pin="";sessionStorage.removeItem("bcc_admin");$("lerr").textContent=e.message==="auth"?"Wrong passcode.":"Couldn’t reach the server."}
}
$("go").onclick=()=>{pin=$("pin").value;start()};$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("q").oninput=draw;$("for").onchange=draw;$("refresh").onclick=()=>sync().catch(()=>$("err").textContent="Couldn’t refresh.");
$("out").onclick=()=>{sessionStorage.removeItem("bcc_admin");location.reload()};
if(pin)start();
</script>
</body>
</html>
